<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roundtable</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<header class="bar"><div class="brand"><span class="brand-icon">◌</span><div><span data-i18n="app.brand">Roundtable</span> <small>Roundtable</small></div></div><div class="bar-actions"><span id="connection" data-i18n="connection.connecting"></span><label class="language-control"><span data-i18n="language.label"></span><select id="interface-language" data-i18n-aria="language.label"></select></label><button id="settings-button" data-i18n="header.shared"></button><button id="new-button" class="primary" data-i18n="header.new"></button></div></header>
<div id="error" class="error" role="alert" hidden></div>
<div class="layout">
<aside class="sidebar"><h2 data-i18n="meetings.title"></h2><div id="meeting-list"></div><div class="sidebar-note" data-i18n="sidebar.rules"></div><section id="participants"></section></aside>
<main>
<section id="welcome" class="welcome"><div class="eyebrow" data-i18n="welcome.eyebrow"></div><h1 data-i18n="welcome.title"></h1><p data-i18n="welcome.body"></p><button id="welcome-new" class="primary" data-i18n="welcome.start"></button><div id="provider-overview"></div></section>
<section id="meeting" hidden>
<div class="meeting-heading"><div><div class="eyebrow" id="round-label"></div><h1 id="topic"></h1></div><button id="export-button" data-i18n="export"></button></div>
<div class="meeting-settings"><label for="meeting-organizer" data-i18n="organizer.label"></label><select id="meeting-organizer"></select><label for="meeting-leader" data-i18n="meeting.leader"></label><select id="meeting-leader"></select><span id="output-language-label" class="muted"></span></div>
<p class="muted" data-i18n="organizer.roles"></p>
<div id="organizer-notes"></div>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="discussion" data-i18n="tab.discussion"></button><button role="tab" aria-selected="false" data-tab="reports" data-i18n="tab.reports" hidden></button><button role="tab" aria-selected="false" data-tab="decision" data-i18n="tab.decision"></button></div>
<div class="controls"><span id="turn-state" aria-live="polite"></span><div><button id="start-button" class="primary"></button><button id="pause-button" data-i18n="action.pause"></button><button id="restart-button" data-i18n="action.restart" hidden></button><button id="finish-button" data-i18n="action.finish"></button></div></div>
<div id="history-notice" class="error" role="status" hidden></div>
<div id="meeting-error" class="error" hidden></div><div id="investigation-progress" hidden></div>
<section id="discussion-panel"><div id="messages"></div><div id="followup-messages"></div><div id="pending"></div><form id="composer"><div id="answer-routing" hidden><label for="followup-target" data-i18n="followup.target"></label><select id="followup-target"></select></div><div id="followup-reference" class="reply" hidden></div><label id="composer-label" for="message-input" data-i18n="composer.label"></label><textarea id="message-input" rows="3" data-i18n-placeholder="composer.placeholder" maxlength="12000"></textarea><div class="compose-actions"><span id="compose-note"></span><button id="cancel-followup" type="button" data-i18n="followup.cancel" hidden></button><button type="submit" class="primary" data-i18n="composer.submit"></button></div></form></section>
<section id="reports-panel" hidden></section><section id="decision-panel" hidden></section>
</section>
</main>
<aside class="evidence"><h2 data-i18n="evidence.title"></h2><p class="muted" data-i18n="evidence.note"></p><div id="evidence-content"></div><section id="research"></section></aside>
</div>
<dialog id="new-dialog"><form id="new-form"><div class="dialog-header"><h2 data-i18n="new.title"></h2><button type="button" data-close="new-dialog" data-i18n-aria="action.close">×</button></div><label for="topic-input" data-i18n="new.topic"></label><textarea id="topic-input" rows="4" required maxlength="12000" data-i18n-placeholder="new.placeholder"></textarea>
<div class="form-row"><label for="mode-input" data-i18n="new.mode"></label><select id="mode-input"><option value="discussion" data-i18n="mode.discussion"></option><option value="independent" data-i18n="mode.independent"></option></select></div><p id="mode-note" class="muted" data-i18n="new.modeNote" hidden></p>
<div class="form-row"><label for="organizer-input" data-i18n="organizer.label"></label><select id="organizer-input"></select></div>
<input id="organizer-model" type="text" maxlength="160" data-i18n-placeholder="organizer.model" data-i18n-aria="organizer.model">
<p class="muted" data-i18n="organizer.roles"></p><p id="organizer-status" class="muted"></p>
<fieldset><legend data-i18n="new.participants"></legend><div id="provider-choices"></div></fieldset>
<div class="form-row"><label for="leader-input" data-i18n="new.leader"></label><select id="leader-input" required></select></div>
<div class="form-row"><label for="round-input" data-i18n="new.rounds"></label><input id="round-input" type="number" min="1" max="10" value="10" required></div>
<div class="form-row"><label for="meeting-language" data-i18n="new.language"></label><select id="meeting-language"></select></div>
<div id="timeout-row" class="form-row" hidden><label for="timeout-input" data-i18n="new.timeout"></label><input id="timeout-input" type="number" min="1" max="30" value="10" required></div>
<p class="muted" data-i18n="new.note"></p><div class="dialog-actions"><button type="button" data-close="new-dialog" data-i18n="action.cancel"></button><button type="submit" class="primary" data-i18n="new.create"></button></div></form></dialog>
<dialog id="settings-dialog"><div class="dialog-header"><h2 data-i18n="shared.title"></h2><button data-close="settings-dialog" data-i18n-aria="action.close">×</button></div><p data-i18n="shared.body"></p><h3 data-i18n="shared.library"></h3><p class="muted" data-i18n="shared.libraryNote"></p><h3 data-i18n="shared.rules"></h3><pre id="skill-info"></pre><h3 data-i18n="shared.external"></h3><p class="muted" data-i18n="shared.externalNote"></p><textarea id="mcp-config" rows="10" spellcheck="false" data-i18n-aria="shared.external"></textarea><div class="dialog-actions"><button id="save-settings" class="primary" data-i18n="shared.save"></button></div></dialog>
<dialog id="restart-dialog"><form id="restart-form"><div class="dialog-header"><h2 data-i18n="restart.title"></h2><button type="button" data-close="restart-dialog" data-i18n-aria="action.close">×</button></div><p class="muted" data-i18n="restart.note"></p><label for="restart-topic" data-i18n="new.topic"></label><textarea id="restart-topic" rows="5" required maxlength="12000"></textarea><label for="restart-language" data-i18n="new.language"></label><select id="restart-language"></select><div class="dialog-actions"><button type="button" data-close="restart-dialog" data-i18n="action.cancel"></button><button type="submit" class="primary" data-i18n="action.restart"></button></div></form></dialog>
</body></html>
