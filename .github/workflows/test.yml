name: Unit & Build Tests (Python & Swift)

on:
  push:
    branches:
      - main
      - 'charzl/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r python/requirements.txt

      - name: Run Python syntax check
        run: python3 -m py_compile python/*.py

      - name: Run Python Unit Tests
        run: python3 -m unittest discover -s python/tests -p "test_*.py" -v

      - name: Run Swift Build & Compilation Test
        if: matrix.os == 'macos-14'
        run: swift build --package-path swift

      - name: Set up Node.js 22 (for Deprecated JS Archive Reference)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'javascript-deprecated/package-lock.json'

      - name: Verify Deprecated JavaScript Archive Reference
        run: |
          npm --prefix javascript-deprecated ci
          npm --prefix javascript-deprecated run check
          npm --prefix javascript-deprecated test

      - name: Generate GitHub Step Summary
        if: always()
        run: |
          echo "## 🧪 Roundtable CI Test Summary (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Operating System**: \`${{ matrix.os }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Primary Stack 1 (Python)**: ✅ Unit Tests Passed (models, engine, participants, claims, store)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            echo "- **Primary Stack 2 (Swift)**: ✅ Native SwiftUI/AppKit Build Complete" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Primary Stack 2 (Swift)**: ⏭️ Skipped on Linux (macOS Native Target)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Archived Stack (JavaScript)**: 📦 Deprecated Reference Tests Passed" >> $GITHUB_STEP_SUMMARY
