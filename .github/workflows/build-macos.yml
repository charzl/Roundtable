name: Build macOS Packages

on:
  push:
    branches:
      - main
      - charzl/macos-github-runner
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with built packages'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            name: Apple Silicon (ARM64)
          - os: macos-13
            arch: x64
            name: Intel (x64)

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run syntax checks
        run: npm run check

      - name: Run automated test suite
        run: npm test

      - name: Package macOS application (DMG & ZIP)
        run: npm run package:mac

      - name: Verify package artifacts
        run: |
          ls -lh dist/Roundtable-*-mac-${{ matrix.arch }}.*
          cat dist/Roundtable-*-mac-${{ matrix.arch }}.sha256

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roundtable-mac-${{ matrix.arch }}
          path: |
            dist/Roundtable-*-mac-${{ matrix.arch }}.dmg
            dist/Roundtable-*-mac-${{ matrix.arch }}.zip
            dist/Roundtable-*-mac-${{ matrix.arch }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          path: release-packages
          merge-multiple: true

      - name: Display downloaded packages
        run: |
          echo "Release artifacts:"
          ls -lh release-packages/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-packages/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
