name: Build macOS Packages

on:
  push:
    branches:
      - main
      - 'charzl/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with built packages'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS ARM64 (Python & Swift)
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python/requirements.txt'

      - name: Set up Node.js 22 (for packaging pipeline)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'javascript-deprecated/package-lock.json'

      - name: Install dependencies
        run: |
          pip install -r python/requirements.txt
          npm --prefix javascript-deprecated ci

      - name: Run Primary Python Unit Tests
        run: python3 -m unittest discover -s python/tests -p "test_*.py" -v

      - name: Run Primary Swift Native Build
        run: swift build --package-path swift

      - name: Package all stacks (Primary: Swift & Python, Reference: JS)
        run: node package-all.js

      - name: Verify package artifacts
        run: |
          ls -lh dist/
          cat dist/checksums.sha256

      - name: Generate GitHub Step Summary
        if: always()
        run: |
          echo "## 📦 macOS ARM64 Application Packaging Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌟 主力原生客户端 / Primary Production Stacks" >> $GITHUB_STEP_SUMMARY
          echo "- **Swift Native (SwiftUI/AppKit)**: 极致秒开与微型包体 (~0.48 MB)" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Native (PySide6)**: 跨平台高性能与 AI 生态兼容 (~27 MB)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 已生成分发产物列表 / Generated Distribution Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| 产物类型 | 文件名 | SHA256 (Prefix) |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          awk '{print "| 软件包 | `" $2 "` | `" substr($1,1,12) "...` |"}' dist/checksums.sha256 >> $GITHUB_STEP_SUMMARY

      - name: Upload macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Roundtable-macOS-ARM64-Packages
          path: |
            dist/Roundtable-*.dmg
            dist/Roundtable-*.zip
            dist/Roundtable-*.sha256
            dist/checksums.sha256
            dist/artifacts-manifest.json
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-macos-arm64]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          name: Roundtable-macOS-ARM64-Packages
          path: release-packages

      - name: Display downloaded packages
        run: |
          echo "Release artifacts:"
          ls -lh release-packages/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-packages/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
