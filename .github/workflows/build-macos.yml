name: Build macOS Packages

on:
  push:
    branches:
      - main
      - 'charzl/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with built packages'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS ARM64 (Apple Silicon)
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm --prefix javascript ci

      - name: Run syntax checks
        run: npm run check

      - name: Run automated test suite
        run: npm test

      - name: Package macOS application (ARM64 DMG & ZIP)
        run: npm run package:mac

      - name: Run post-packaging verification tests
        run: npm --prefix javascript test javascript/tests/package.test.js

      - name: Verify package artifacts
        run: |
          DIST_DIR=$([ -d "javascript/dist" ] && echo "javascript/dist" || echo "dist")
          ls -lh $DIST_DIR/Roundtable-*-mac-arm64.*
          cat $DIST_DIR/Roundtable-*-mac-arm64.sha256

      - name: Upload macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Roundtable-macOS-ARM64
          path: |
            javascript/dist/Roundtable-*-mac-arm64.dmg
            javascript/dist/Roundtable-*-mac-arm64.zip
            javascript/dist/Roundtable-*-mac-arm64.sha256
            javascript/dist/artifacts-manifest.json
            dist/Roundtable-*-mac-arm64.dmg
            dist/Roundtable-*-mac-arm64.zip
            dist/Roundtable-*-mac-arm64.sha256
            dist/artifacts-manifest.json
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: [build-macos-arm64]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          name: roundtable-mac-arm64
          path: release-packages

      - name: Display downloaded packages
        run: |
          echo "Release artifacts:"
          ls -lh release-packages/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-packages/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
