name: Build macOS Packages

on:
  push:
    branches:
      - main
      - 'charzl/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with built packages'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS ARM64 (Swift Native)
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Swift Build & Package
        run: bash swift/package.sh

      - name: Verify package artifacts
        run: |
          ls -lh swift/dist/
          cat swift/dist/*.sha256

      - name: Generate GitHub Step Summary
        if: always()
        run: |
          echo "## 🍏 macOS ARM64 Swift Native Packaging Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌟 macOS 原生分发包 / Primary macOS Native Client" >> $GITHUB_STEP_SUMMARY
          echo "- **Swift Native (SwiftUI/AppKit)**: 极致秒开与微型包体 (~0.5 MB)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 已生成分发产物列表 / Generated Distribution Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| 产物类型 | 文件名 | SHA256 (Prefix) |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          awk '{print "| macOS 原生软件包 | `" $2 "` | `" substr($1,1,12) "...` |"}' swift/dist/*.sha256 >> $GITHUB_STEP_SUMMARY

      - name: Upload macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Roundtable-macOS-Swift-ARM64-Packages
          path: |
            swift/dist/Roundtable-Swift-*.zip
            swift/dist/Roundtable-Swift-*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-macos-arm64]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Swift packages
        uses: actions/download-artifact@v4
        with:
          name: Roundtable-macOS-Swift-ARM64-Packages
          path: release-packages

      - name: Display downloaded packages
        run: |
          echo "Release artifacts:"
          ls -lh release-packages/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-packages/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
